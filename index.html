    const res = await fetch(OLLAMA + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: VISION_MODEL, messages: [{ role: 'user', content: prompt, images: [b64] }], stream: false, keep_alive: '5m', options: { num_ctx: 4096 } }),
    });
    const raw = await res.text();
    let json = {}; try { json = JSON.parse(raw); } catch (e) {}
    if (!res.ok) throw new Error(json.error || raw);
    return (json.message?.content || '').replace(/<think>[\s\S]*?(<\/think>|$)/g, '').trim() || '(no description returned)';
  }
  // Fills m.imageDesc once per message; later turns reuse the stored text
  async function describeNewImages(chat) {
    for (const m of chat.messages) {
      if (m.role !== 'user' || !m.images || !m.images.length) continue;
      m.imageDesc = m.imageDesc || [];
      for (let i = m.imageDesc.length; i < m.images.length; i++) {
        $('status').textContent = 'Reading image ' + (i + 1) + ' of ' + m.images.length + ' with ' + VISION_MODEL + '…';
        try { m.imageDesc[i] = await describeImage(m.images[i], m.content); }
        catch (e) {
          toast('Vision model failed: ' + e.message.slice(0, 120));
          m.imageDesc[i] = null;   // retried on the next message
          break;
        }
      }
    }
    $('status').textContent = '';
  }
  const imageContext = m => (m.images || []).map((_, i) => m.imageDesc && m.imageDesc[i]
    ? '[Image ' + (i + 1) + ' (described by the vision model ' + VISION_MODEL + '; you cannot see it yourself)]\n' + m.imageDesc[i] + '\n[End of image ' + (i + 1) + ']'
    : '[Image ' + (i + 1) + ' could not be read; tell the user the vision model ' + VISION_MODEL + ' failed or is not installed]').join('\n\n');

  // Opens the chat stream; if the model rejects `think`, retries once without it
  async function openStream(body, signal) {
    const post = () => fetch(OLLAMA + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal,
    });
    let res = await post();
    if (!res.ok) {
      const txt = await res.text();
      if ('think' in body && /think/i.test(txt)) {
        delete body.think;
        $('status').textContent = "This model doesn't support thinking";
        res = await post();
        if (!res.ok) throw new Error(errMsg(await res.text()));
        return res;
      }
      throw new Error(errMsg(txt));
    }
    return res;
  }

  async function send() {
    if (controller) { controller.abort(); return; }
    if (preparing) return;
    const text = $('prompt').value.trim();
    if (!text && !pending.length) return;

    let chat = getChat();
    if (!chat) {
      chat = { id: Date.now().toString(36), title: 'New chat', updated: Date.now(), messages: [] };
      chats.unshift(chat); currentId = chat.id;
    }
    if (!chat.messages.length) chat.title = (text || pending[0].name).slice(0, 40);

    // Text-based files are merged into the prompt; images go in the images array
    // Editable files (including PDF/DOCX text) live in chat.work and are always sent in their latest version
    chat.work = chat.work || {};
    pending.filter(a => a.editable).forEach(a => {
      // Re-attaching a file with the same name replaces the stored copy
      const k = Object.keys(chat.work).find(x => x.toLowerCase() === a.name.toLowerCase()) || a.name;
      chat.work[k] = { text: a.data, crlf: !!a.crlf };
      if (a.handle) setHandle(hkey(chat.id, k), a.handle); else dropHandle(hkey(chat.id, k));
    });
    touchWork(chat); flushWork();
    const textParts = pending.filter(a => a.kind === 'text').map(a => a.editable
      ? `[Attached file: ${a.name}]`
      : `[File: ${a.name}]\n${a.data}\n[End of ${a.name}]`);
    const userMsg = {
      role: 'user',
      content: text,
      ctx: [...textParts, text || 'Describe these files.'].join('\n\n'),
      images: pending.filter(a => a.kind === 'image').map(a => a.data),
      files: pending.filter(a => a.kind === 'text').map(a => a.name),
    };
    const botMsg = { role: 'assistant', content: '', thinking: '', noThink: !thinkOn, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
    chat.messages.push(userMsg, botMsg);
    chat.updated = Date.now();

    $('prompt').value = ''; autoGrow(); pending = []; renderChips();
    renderHistory(); renderThread();

    // Explicit memory commands ("remember …", "forget …", "call me …") are handled BEFORE the reply, so the reply already knows
    if (autoMemory && text && MEM_NOW(text)) {
      preparing = true;
      try { await autoRemember(userMsg, chat, text, true); } catch (e) { /* the retry after the reply covers it */ } finally { preparing = false; }
    }

    const body = $('thread').lastElementChild.querySelector('.body');
    body.querySelector('.content').classList.add('typing');

    // Pick up changes made to the files on disk since the last message
    preparing = true;
    try { await refreshFromDisk(chat); } finally { preparing = false; }
    renderChatFiles();

    // Make sure the memory is current: wait for pending changes from the previous message, then re-read it
    await Promise.race([memoryQueue, new Promise(r => setTimeout(r, 2500))]);   // don't block the reply on a slow extractor
    await refreshMemory();

    // Images never go to the chosen model: lfm3-vl:2b turns them into text first
    await describeNewImages(chat);

    // Saved memory + conversation history (without the empty placeholder) go to the model.
    // Messages that taught a fact which was later replaced or forgotten are left out, together with their reply.
    const history = chat.messages.slice(0, -1);
    const apiMessages = history.filter((m, i) => !isStaleMsg(m) && !(m.role === 'assistant' && isStaleMsg(history[i - 1]))).map(m => {
      const o = { role: m.role, content: m.role === 'assistant' ? (stripFileBlocks(splitThink(m).answer).trim() || 'Done.') : (m.ctx ?? m.content) };
      if (m.role === 'user' && m.images && m.images.length) o.content = (imageContext(m) + '\n\n' + o.content).trim();
      return o;
    });
    if (apiMessages.length && apiMessages[apiMessages.length - 1].role === 'user') {
      apiMessages[apiMessages.length - 1].content += memoryReminder(text) + fileReminder(text);
    }
    // Qwen3-style models can ignore think:false, so also use their soft switch when Think is off
    if (!thinkOn && apiMessages.length && apiMessages[apiMessages.length - 1].role === 'user') {
      apiMessages[apiMessages.length - 1].content += ' /no_think';
    }
    const fileText = fileSystemPrompt(chat);
    // Rules go first of all, then the file instructions; memory goes last in the system area so it is closest to the conversation
    apiMessages.unshift({ role: 'system', content: [rulesPrompt(), fileText, (memoryPrompt() || {}).content].filter(Boolean).join('\n\n') });

    // Ollama's default context is small: always give long answers and attached files room, and lift any output cap
    const ctxChars = apiMessages.reduce((n, x) => n + x.content.length, 0);
    const options = { num_ctx: Math.min(32768, Math.max(16384, Math.ceil((ctxChars / 3 + 8192) / 8192) * 8192)), num_predict: -1 };

    lastNumCtx = options.num_ctx;
    controller = new AbortController();
    updateSend();
    let queued = false, t0 = null, finished = false;
    const paint = () => { queued = false; if (finished || holdPaint()) return; paintBot(body, botMsg, true); scrollDown(); };
    const stamp = () => {
      if (botMsg.thinkTime || !t0) return;
      const s = splitThink(botMsg);
      if (s.think && s.answer) botMsg.thinkTime = Math.max(1, Math.round((Date.now() - t0) / 1000));
    };

    // Drops text the model repeats when it resumes after being cut off
    const dedupe = (a, b) => {
      const tail = a.slice(-300), bt = b.replace(/^\s+/, '');
      for (let n = Math.min(tail.length, bt.length); n >= 4; n--) if (bt.startsWith(tail.slice(-n))) return bt.slice(n);
      return b;
    };
    let reason = '';
    const consume = async (msgs, resumed, thinkFlag) => {
      reason = '';
      const res = await openStream(
        { model: $('model').value, messages: msgs, stream: true, think: thinkFlag, options },
        controller.signal
      );
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', head = '', holding = resumed;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const chunk = JSON.parse(line);
          if (chunk.error) throw new Error(chunk.error);
          if (chunk.done) reason = chunk.done_reason || '';
          const msg = chunk.message;
          if (msg?.thinking || msg?.content) {
            if (!t0) t0 = Date.now();
            if (msg.thinking && thinkOn) botMsg.thinking += msg.thinking;
            if (msg.content) {
              if (holding) {
                head += msg.content;
                if (head.length >= 200) { botMsg.content += dedupe(botMsg.content, head); holding = false; head = ''; }
              } else botMsg.content += msg.content;
            }
            stamp();
            if (!queued) { queued = true; setTimeout(() => requestAnimationFrame(paint), botMsg.content.length > 20000 ? 350 : 0); }
          }
        }
      }
      if (holding && head) botMsg.content += dedupe(botMsg.content, head);
    };

    try {
      await consume(apiMessages, false, thinkOn);
      // Hit the output limit mid-answer (long files): ask the model to carry on, up to 8 times
      let rounds = 0;
      while (reason === 'length' && rounds < 8) {
        const partial = splitThink(botMsg).answer;
        if (!partial.trim()) break;
        rounds++;
        $('status').textContent = 'Long output: continuing (' + rounds + ')…';
        await consume([
          ...apiMessages,
          { role: 'assistant', content: partial },
          { role: 'user', content: 'Your reply was cut off by the output limit. Continue from exactly where it stopped. Do not repeat anything, do not add an introduction, and do not open a new code fence: you are still inside the same block, so keep writing its content and close the block when the content is complete.' },
        ], true, false);
      }
      $('status').textContent = '';
    } catch (e) {
      if (e.name !== 'AbortError') {
        botMsg.content += (botMsg.content ? '\n\n' : '') + '⚠️ ' + e.message;
      }
      $('status').textContent = '';
    }

    finished = true;
    controller = null;
    if (!botMsg.thinking) delete botMsg.thinking;
    if (!botMsg.thinkTime && t0 && splitThink(botMsg).think) botMsg.thinkTime = Math.max(1, Math.round((Date.now() - t0) / 1000));
    body.querySelector('.content').classList.remove('typing');
    whenFree(() => paintBot(body, botMsg, false));
    const made = harvestFiles(chat, botMsg);
    if (made.length) { renderChatFiles(); toast(made.length === 1 ? 'Created ' + made[0] : 'Created ' + made.length + ' files'); }
    chat.updated = Date.now();
    save(); renderHistory(); updateSend();

    // Auto-save memory when the message hints the user wants something remembered
    if (autoMemory && text && (MEM_HINT.test(text) || MEM_NOW(text))) autoRemember(userMsg, chat, text);
  }

  // ---------- UI wiring ----------
  function autoGrow() {
    const p = $('prompt');
    p.style.height = 'auto';
    p.style.height = Math.min(p.scrollHeight, 200) + 'px';
    updateSend();
  }
  $('prompt').addEventListener('input', autoGrow);
  $('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('send').onclick = send;
  // The file picker gives us a handle, so edits can be written back into the original file
  $('attach').onclick = async () => {
    if (window.showOpenFilePicker) {
      try {
        const hs = await showOpenFilePicker({ multiple: true });
        for (const h of hs) await addFile(await h.getFile(), h);
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    $('file').click();
  };
  $('file').onchange = e => { [...e.target.files].forEach(f => addFile(f)); e.target.value = ''; };

  // Drag & drop anywhere on the window
  window.addEventListener('dragover', e => { e.preventDefault(); $('box').classList.add('over'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) $('box').classList.remove('over'); });
  window.addEventListener('drop', async e => {
    e.preventDefault(); $('box').classList.remove('over');
    // Handles and files must be requested synchronously, before the event ends
    const items = [...(e.dataTransfer.items || [])].filter(i => i.kind === 'file').map(i => ({
      file: i.getAsFile(),
      handle: i.getAsFileSystemHandle ? i.getAsFileSystemHandle().catch(() => null) : null,
    }));
    if (!items.length) { [...e.dataTransfer.files].forEach(f => addFile(f)); return; }
    for (const it of items) {
      const h = await it.handle;
      if (it.file) await addFile(it.file, h && h.kind === 'file' ? h : null);
    }
  });

  // Paste images from the clipboard
  window.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); files.forEach(f => addFile(f)); }
  });

  // ---------- Init ----------
  initIcons();
  renderThink();
  loadModels();
  loadMemory().then(migrateMemory);
  renderHistory();
  renderThread();
  initStore();
  $('prompt').focus();
</script>
</body>
</html>
